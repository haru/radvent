# Solid Cache configuration. No `database:` key on purpose: the store uses the
# primary database connection shared by every app process (docs/adr/0011-*).
default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
